<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Turkish TTS">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="128" height="128" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="128" height="128" fill="url(#tile)"/>
    <rect width="128" height="70" fill="url(#sheen)"/>
    <circle cx="106" cy="24" r="30" fill="#ffffff" opacity="0.10"/>
    <circle cx="118" cy="16" r="26" fill="url(#tile)" opacity="0.55"/>
  </g>

  <g fill="#ffffff">
    <rect x="22" y="58" width="9" height="12" rx="4.5" opacity="0.70"/>
    <rect x="37" y="48" width="9" height="32" rx="4.5" opacity="0.85"/>
    <rect x="52" y="34" width="9" height="60" rx="4.5"/>
    <rect x="67" y="26" width="9" height="76" rx="4.5"/>
    <rect x="82" y="42" width="9" height="44" rx="4.5" opacity="0.85"/>
    <rect x="97" y="54" width="9" height="20" rx="4.5" opacity="0.70"/>
  </g>

  <rect x="22" y="62" width="84" height="4" rx="2" fill="#ffffff" opacity="0.35"/>
</svg>
