<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Uzaktan Ses Çalar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            resize: vertical;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status {
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: #333;
        }

        .status.connected {
            color: #4CAF50;
            border-left: 4px solid #4CAF50;
        }

        .status.disconnected {
            color: #F44336;
            border-left: 4px solid #F44336;
        }

        .logs-container {
            background-color: #0c0c0c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 4px;
        }

        .log-time {
            color: #888;
            margin-right: 10px;
        }

        .log-info {
            color: #64B5F6;
        }

        .log-event {
            color: #FFB300;
        }

        .log-chunk {
            color: #81C784;
        }

        .log-error {
            color: #E57373;
            font-weight: bold;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>

<body>

    <h1>TTS Uzaktan Ses Çalar</h1>

    <div class="controls">
        <div>
            <label for="server-url">Sunucu WS URL: </label>
            <input type="text" id="server-url"
                style="background:#2d2d2d; color:#fff; border:1px solid #444; padding:6px; width:250px; border-radius:4px;"
                value="">
        </div>
        <div id="connection-status" class="status disconnected">Hazır Bekleniyor</div>
    </div>

    <textarea id="text-input"
        placeholder="Sentezlenmesini istediğiniz metni buraya girin...">Merhaba. Bu sistem WebSocket üzerinden anlık olarak ses akışı sağlayabilmektedir.</textarea>

    <div style="margin-bottom: 20px;">
        <button id="play-btn">Oynat / Sentezle</button>
    </div>

    <h3>Ağ ve Chunk (Paket) Logları</h3>
    <div class="logs-container" id="logs"></div>

    <script>
        // Varsayılan WS URL oluştur (örn: ws://192.168.1.55:8000/v1/tts/stream)
        const host = window.location.host || '127.0.0.1:8000';
        const defaultWsUrl = `ws://${host}/v1/tts/stream`;
        document.getElementById('server-url').value = defaultWsUrl;

        const textInput = document.getElementById('text-input');
        const playBtn = document.getElementById('play-btn');
        const logsDiv = document.getElementById('logs');
        const statusDiv = document.getElementById('connection-status');
        const urlInput = document.getElementById('server-url');

        let audioContext = null;
        let nextPlayTime = 0;
        let chunkCount = 0;
        let totalBytes = 0;
        let ws = null;
        let currentSampleRate = 48000;
        let startTime = 0;

        // Prefetch (Biriktirme) Değişkenleri
        let audioQueue = [];
        let isPlaying = false;
        let isRebuffering = false;
        const PREFETCH_COUNT = 18;
        const REBUFFER_COUNT = 0;

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            let colorClass = 'log-info';
            if (type === 'event') colorClass = 'log-event';
            if (type === 'chunk') colorClass = 'log-chunk';
            if (type === 'error') colorClass = 'log-error';

            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        // Web Audio API'yi Başlat (Kullanıcı etkileşimi gerektiği için Butona basıldığında çağrılır)
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log('Web Audio API başlatıldı.', 'info');
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Paketi kuyruğa ekle, yeteri kadar biriktiyse çalmayı başlat
        function enqueuePCM16Chunk(pcm16Bytes) {
            audioQueue.push(pcm16Bytes);

            let targetCount = isRebuffering ? REBUFFER_COUNT : PREFETCH_COUNT;

            if (!isPlaying && audioQueue.length >= targetCount) {
                startPlayback();
            }
        }

        // Çalmayı başlat ve kuyruktakileri programa al
        function startPlayback() {
            if (audioQueue.length === 0) return;
            isPlaying = true;
            isRebuffering = false;

            const elapsed = (performance.now() - startTime).toFixed(1);
            log(`TAMPON DOLDU (${audioQueue.length} paket). Çalma başlatılıyor. (T+${elapsed}ms)`, 'event');

            // Eğer nextPlayTime çok geride kaldıysa güncelle
            if (nextPlayTime < audioContext.currentTime) {
                nextPlayTime = audioContext.currentTime + 0.1; // 100ms güvenli pay
            }

            while (audioQueue.length > 0) {
                scheduleChunk(audioQueue.shift());
            }
        }

        // PCM16 verisini Float32'ye çevirip Web Audio Buffer'a ekle ve zamanla
        function scheduleChunk(pcm16Bytes) {
            // PCM16'yı Float32'ye dönüştür (-1.0 ile 1.0 arası)
            const int16Array = new Int16Array(pcm16Bytes);
            const float32Array = new Float32Array(int16Array.length);

            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            // Audio Buffer oluştur
            const buffer = audioContext.createBuffer(1, float32Array.length, currentSampleRate);
            buffer.getChannelData(0).set(float32Array);

            // Çalmak için kaynak oluştur
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);

            source.start(nextPlayTime);
            nextPlayTime += buffer.duration;
        }

        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert("Lütfen bir metin girin.");
                return;
            }

            initAudioContext();

            // Önceki bağlantıyı temizle
            if (ws) {
                ws.close();
            }

            logsDiv.innerHTML = ''; // Temizle
            chunkCount = 0;
            totalBytes = 0;
            nextPlayTime = 0;
            startTime = performance.now();
            audioQueue = [];
            isPlaying = false;

            const wsUrl = urlInput.value;
            log(`Bağlantı kuruluyor: ${wsUrl}`, 'info');

            statusDiv.textContent = 'Bağlanıyor...';
            statusDiv.className = 'status';

            playBtn.disabled = true;

            try {
                ws = new WebSocket(wsUrl);
                ws.binaryType = "arraybuffer"; // Çok önemli, gelen veriyi byte dizisi olarak al

                ws.onopen = () => {
                    statusDiv.textContent = 'Bağlandı';
                    statusDiv.className = 'status connected';

                    const latency = (performance.now() - startTime).toFixed(1);
                    log(`WebSocket bağlantısı başarılı. (${latency}ms)`, 'info');
                    log(`İstek gönderiliyor: "${text.substring(0, 30)}..."`, 'info');

                    // İsteği gönder
                    ws.send(JSON.stringify({ text: text }));
                };

                ws.onmessage = (event) => {
                    const elapsed = (performance.now() - startTime).toFixed(1);

                    if (typeof event.data === "string") {
                        // JSON Kontrol Mesajı
                        try {
                            const data = JSON.parse(event.data);
                            if (data.event === "stream_start") {
                                currentSampleRate = data.sample_rate || 48000;
                                log(`STREAM START: Format=${data.format}, SampleRate=${currentSampleRate}Hz (T+${elapsed}ms)`, 'event');
                            }
                            else if (data.event === "sentence_complete") {
                                log(`Cümle tamamlandı. İndeks: ${data.sentence_index} (T+${elapsed}ms)`, 'event');
                            }
                            else if (data.event === "stream_end") {
                                log(`STREAM END: Akış tamamlandı. Toplam ${chunkCount} paket, ${(totalBytes / 1024).toFixed(2)} KB alındı. (T+${elapsed}ms)`, 'event');
                                if (!isPlaying && audioQueue.length > 0) {
                                    startPlayback(); // Kalanları çal
                                }
                                ws.close();
                            }
                            else if (data.event === "error") {
                                log(`HATA: ${data.message}`, 'error');
                                ws.close();
                            }
                        } catch (e) {
                            log(`JSON ayrıştırma hatası: ${e.message}`, 'error');
                        }
                    } else {
                        // Binary Ses Verisi (PCM16)
                        chunkCount++;
                        const byteLength = event.data.byteLength;
                        totalBytes += byteLength;

                        log(`CHUNK ${chunkCount}: Alındı -> ${byteLength} bytes. Toplam: ${(totalBytes / 1024).toFixed(2)} KB (T+${elapsed}ms)`, 'chunk');

                        // Sesi Oynat veya Biriktir
                        try {
                            if (isPlaying) {
                                // Underrun kontrolü (ses çoktan bitmişse)
                                if (nextPlayTime < audioContext.currentTime) {
                                    log(`UNDERRUN: Ses tamponu boşaldı. Yeniden biriktiriliyor...`, 'error');
                                    isPlaying = false;
                                    isRebuffering = true;
                                    enqueuePCM16Chunk(event.data);
                                } else {
                                    scheduleChunk(event.data);
                                }
                            } else {
                                enqueuePCM16Chunk(event.data);
                            }
                        } catch (e) {
                            log(`Ses çalma hatası: ${e.message}`, 'error');
                        }
                    }
                };

                ws.onclose = () => {
                    if (!isPlaying && audioQueue.length > 0) {
                        startPlayback(); // Tampon dolmadıysa da bitince kalanları çal
                    }
                    statusDiv.textContent = 'Bağlantı Kesildi';
                    statusDiv.className = 'status disconnected';
                    playBtn.disabled = false;
                    log('WebSocket bağlantısı kapatıldı.', 'info');
                };

                ws.onerror = (error) => {
                    log(`WebSocket Hatası oluştu. Lütfen URL'yi veya sunucuyu kontrol edin.`, 'error');
                    playBtn.disabled = false;
                };

            } catch (err) {
                log(`Bağlantı başlatılamadı: ${err.message}`, 'error');
                playBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
